services:
  # Backend Service
  - type: web
    name: despesas-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: despesas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://despesas-frontend.onrender.com

  # Frontend Service
  - type: web
    name: despesas-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: NODE_ENV
        value: production
      - key: REACT_APP_API_URL
        value: https://despesas-backend.onrender.com

databases:
  - name: despesas-db
    databaseName: despesas
    user: despesas_user

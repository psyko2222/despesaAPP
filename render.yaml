services:
  # Backend Service
  - type: web
    name: despesas-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: despesas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://despesa-app.vercel.com
      # Email SMTP Configuration (Hotmail/Outlook)
      - key: SMTP_HOST
        value: smtp-mail.outlook.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false # Configure manualmente no dashboard
      - key: SMTP_PASS
        sync: false # Configure manualmente no dashboard
      - key: SMTP_FROM
        sync: false # Configure manualmente no dashboard

  # Frontend Service
  - type: web
    name: despesas-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: NODE_ENV
        value: production
      - key: REACT_APP_API_URL
        value: https://despesaapp.onrender.com

databases:
  - name: despesas-db
    databaseName: despesas
    user: despesas_user

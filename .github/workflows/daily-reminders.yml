name: Disparar Lembretes Diários

on:
  # O disparo agendado diário é feito nativamente pelo Vercel Cron (configurado em frontend/vercel.json)
  # às 09:05 UTC. O agendamento do GitHub Actions foi desativado para evitar disparos duplicados em simultâneo.
  # Mantém-se workflow_dispatch para permitir testes manuais sempre que necessário.
  # schedule:
  #   - cron: '5 9 * * *'
  workflow_dispatch:
    inputs:
      force_day:
        description: 'Simular dia do mês (opcional, ex: 1, 15, 20)'
        required: false
        default: ''
      force:
        description: 'Forçar envio ignorando deduplicação diária (true/false)'
        required: false
        default: 'false'

jobs:
  check-reminders:
    name: Enviar Lembretes de Despesas
    runs-on: ubuntu-latest
    steps:
      - name: Processar Lembretes na Vercel
        run: |
          echo "======================================================="
          echo "⏰ A iniciar rotina de lembretes diários: $(date -u)"
          echo "======================================================="

          # Chave de segurança sincronizada com a Vercel
          SECRET="despesas-cron-secret-key-change-this"

          URL="https://despesa-app.vercel.app/api/reminders/check?secret=${SECRET}"
          
          # Se o utilizador forneceu force_day no teste manual
          if [ -n "${{ github.event.inputs.force_day }}" ]; then
            URL="${URL}&forceDay=${{ github.event.inputs.force_day }}"
          fi

          # Se o utilizador solicitou forçar envio
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            URL="${URL}&force=true"
          fi

          echo "A chamar endpoint na Vercel..."

          RESPONSE=$(curl -s -S \
            --max-time 30 \
            -w "\nHTTP_CODE:%{http_code}" \
            -X POST "$URL")

          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_CODE:")

          echo "Código HTTP recebido: $HTTP_CODE"
          echo "Resposta do servidor:"
          echo "$BODY"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Lembretes processados com sucesso!"
          else
            echo "❌ Erro ao processar lembretes (Código HTTP: $HTTP_CODE)"
            exit 1
          fi

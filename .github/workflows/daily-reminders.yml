name: Disparar Lembretes Diários

on:
  schedule:
    # Corre todos os dias às 09:05 UTC (10:05 em Lisboa / horário de verão)
    # O minuto :05 é o recomendado pelo GitHub para evitar o congestionamento mundial do minuto :00
    - cron: '5 9 * * *'
  workflow_dispatch:
    inputs:
      force_day:
        description: 'Simular dia do mês (opcional, ex: 1, 15, 20)'
        required: false
        default: ''

jobs:
  check-reminders:
    name: Enviar Lembretes de Despesas
    runs-on: ubuntu-latest
    steps:
      - name: Processar Lembretes na Vercel
        run: |
          echo "======================================================="
          echo "⏰ A iniciar rotina de lembretes diários: $(date -u)"
          echo "======================================================="

          SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$SECRET" ]; then
            SECRET="despesas-cron-secret-key-change-this"
          fi

          URL="https://despesa-app.vercel.app/api/reminders/check?secret=${SECRET}"
          
          # Se o utilizador forneceu force_day no teste manual
          if [ -n "${{ github.event.inputs.force_day }}" ]; then
            URL="${URL}&forceDay=${{ github.event.inputs.force_day }}"
          fi

          echo "A chamar endpoint na Vercel..."

          RESPONSE=$(curl -s -S \
            --max-time 30 \
            -w "\nHTTP_CODE:%{http_code}" \
            -X POST "$URL")

          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_CODE:")

          echo "Código HTTP recebido: $HTTP_CODE"
          echo "Resposta do servidor:"
          echo "$BODY"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Lembretes processados com sucesso!"
          else
            echo "❌ Erro ao processar lembretes (Código HTTP: $HTTP_CODE)"
            exit 1
          fi
